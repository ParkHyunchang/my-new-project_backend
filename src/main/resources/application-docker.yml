spring:
  datasource:
    url: jdbc:mysql://db:3306/my_new_project_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
