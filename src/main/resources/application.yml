spring:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  main:
    allow-bean-definition-overriding: true
  h2:
    console:
      enabled: true
      path: /h2-console
  profiles:
    active: local

server:
  port: 3210

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
