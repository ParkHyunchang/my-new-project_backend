# 시드 사용자 (환경 변수로 설정, .env에서 로드)
# SEED_DEFAULT_USERNAME, SEED_DEFAULT_PASSWORD
seed:
  default-username: ${SEED_DEFAULT_USERNAME:-}
  default-password: ${SEED_DEFAULT_PASSWORD:-}

spring:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  main:
    allow-bean-definition-overriding: true
  h2:
    console:
      enabled: true
      path: /h2-console
  profiles:
    active: local

server:
  port: 3210

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
