version: "3.8"
services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/parkhyunchang/my-new-project_backend:latest}
    container_name: new_project_backend
    ports:
      - "3210:3210"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://172.17.0.1:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SEED_DEFAULT_USERNAME: ${SEED_DEFAULT_USERNAME:-}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - /volume1/docker/my-new-project_backend/logs:/app/logs:Z
    restart: always
